<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四套灵巧手｜仿真核验</title>
<style>
:root{color-scheme:dark;--bg:#0d1520;--panel:#162435;--border:#2c4055;--text:#dfebf6;--muted:#9fb4c8;--accent:#78d9c2;--warn:#ffc18e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}main{max-width:1460px;margin:auto;padding:28px}h1{font-size:29px;line-height:1.3;margin:0 0 10px}h2{font-size:19px;margin:0 0 12px}p{color:var(--muted);margin:8px 0 18px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:2px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.model-card{background:var(--panel);border:1px solid var(--border);padding:15px;border-radius:12px;cursor:pointer;text-align:left;color:var(--text);font:inherit}.model-card.active{border-color:var(--accent)}.model-card strong{display:block;font-size:18px;margin-bottom:5px}.small{font-size:12px;color:var(--muted)}.ok{color:var(--accent)}.fail{color:var(--warn)}.tools{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}select,button.control,a.btn{background:#20354a;color:var(--text);border:1px solid #3b536b;border-radius:8px;padding:9px 12px;font:inherit;text-decoration:none}button{cursor:pointer}select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.panel{background:var(--panel);border:1px solid var(--border);padding:17px;border-radius:12px;margin:15px 0}.status{line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.video-card{background:#101c28;border:1px solid var(--border);border-radius:10px;overflow:hidden}.video-card label{display:block;padding:8px 12px;font-size:13px;color:#bdd0e1}video{width:100%;display:block;aspect-ratio:4/3;background:#060b10}.video-card.tacmap video{aspect-ratio:1200/560}.seek{display:flex;align-items:center;gap:12px;margin:14px 0}input[type=range]{width:100%;accent-color:var(--accent)}#phase{font-size:12px;min-width:280px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}th{font-weight:500;color:var(--muted)}canvas{width:100%;height:230px;background:#101e2b;border-radius:9px}.detail{white-space:pre-wrap;font:12px/1.6 ui-monospace,monospace;max-height:350px;overflow:auto;background:#101e2b;padding:14px}a{color:#a2d2ff}details{margin-top:15px}summary{cursor:pointer;color:#b9cedf}.boundary{border-left:3px solid #778eb0;padding-left:14px}footer{color:var(--muted);font-size:12px;padding:20px 0}@media(max-width:950px){.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){main{padding:16px}h1{font-size:23px}.summary,.grid{grid-template-columns:1fr}.seek{flex-wrap:wrap}#phase{min-width:0}.tools>*{max-width:100%}}
</style></head><body><main>
<div class="eyebrow">G1-D / ISAAC SIM 5.1 / LOCAL VALIDATION</div><h1>四套灵巧手 · 仿真核验</h1><p>逐轴运动、自由物体交互、接触加载和模态数据，均可逐帧查看。每项结果来自其标明的独立录制。</p>
<div class="summary" id="modelCards"></div><div class="tools"><select aria-label="机器人" id="model"></select><select aria-label="测试项目" id="kind"><option value="motion">逐轴运动与回位</option><option value="grasp">自由物体抓取</option><option value="contact">接触与触觉核验</option></select><select aria-label="图像模态" id="modality"><option value="rgb">RGB</option><option value="depth">深度 · 0.1–2.1 m</option></select><button class="control" id="play">同步播放</button><a id="download" class="btn" download>下载同帧 HDF5</a><a id="report" class="btn" target="_blank">原始报告</a><a id="auditLink" class="btn" target="_blank">独立核对</a></div>
<div id="status" class="panel status" aria-live="polite">正在载入已核对的录制…</div><div id="videos" class="grid"></div><div class="seek"><input aria-label="录制帧" id="seek" type="range" min="0" max="1" step="1"><span id="phase"></span></div><p class="small" id="clockNote"></p>
<div class="panel"><h2>分项结果</h2><div id="results" class="table-wrap"></div></div><div class="panel"><div class="tools"><h2>同帧接触力</h2><select aria-label="接触力分量" id="component"><option value="force_world_N">合力</option><option value="normal_force_world_N">法向力</option><option value="friction_force_world_N">摩擦力</option></select></div><p class="small" id="forceNote"></p><canvas id="force" width="1300" height="230"></canvas></div>
<details><summary>当前帧：关节、目标、时间和物体状态</summary><div id="details" class="detail"></div></details><details><summary>数据类型、参数与验证边界</summary><div class="panel boundary" id="boundary"></div></details>
<footer>2026-11-03 · 仅本机仿真，无真机、DDS 或真实相机。材料、安装位姿和真实触点标定仍以原交付的待确认项为准。<a href="validation_report.html">完整验证报告与失败记录</a></footer></main>
<script>
const $=id=>document.getElementById(id);let models=[],run,rows=[],videos=[],activeFrame=0,loadVersion=0;const labels={whole:'整机观察',left:'左手观察',right:'右手观察',head_left:'头部左目',head_right:'头部右目',tacmap:'Sharpa 几何触觉深度 · 10 指尖 · 0–0.8 mm'};const kinds={motion:'逐轴运动与回位',grasp:'自由物体抓取',contact:'接触与触觉核验'};
const fmt=(v,d=3)=>Number(v).toFixed(d);const tag=(ok,yes='通过',no='未通过')=>'<span class="'+(ok?'ok':'fail')+'">'+(ok?yes:no)+'</span>';const mm=v=>fmt(v*1000,2);const side=s=>s==='left'?'左手':'右手';const shape=s=>({sphere:'球体',cube:'方块',cylinder:'圆柱',flat:'平头'}[s]||s);
function table(head,body){return '<table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+body.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function resultTable(kind,audit){const c=audit.checks||{};if(kind==='grasp')return table(['手 / 物体','最低抬升','保持漂移','释放残余力','最终位置偏移','抬升·保持·释放'],c.dynamic_trials.map(x=>[side(x.side)+' / '+shape(x.shape),mm(x.minimum_hold_lift_m)+' mm',mm(x.relative_drift_m)+' mm',fmt(x.release_force_max_N)+' N','<span class="'+(x.release_offset_m>.03?'fail':'ok')+'">'+mm(x.release_offset_m)+' mm</span>',tag(x.passed)]))+'<p class="small">门槛：抬升 ≥30 mm，保持 ≥1 s，腕部相对漂移 &lt;30 mm，接触通道 ≥1，释放残余力 &lt;0.02 N。最终位置偏移单独列出；抬升·保持·释放通过不代表精确放回。大幅位置偏移包含释放后掉落到地面的情况。</p>';
if(kind==='motion'){const axes=c.independent_axis_cases||[];return table(['检查','结果','实测'],[['逐轴运动与跟踪',tag(c.independent_axes_passed),axes.length+' 个方向测试'],['回位',tag(c.final_return_error_rad<.02),fmt(c.final_return_error_rad,6)+' rad'],['正向运动学',tag(c.fk_max_error_m<.001),mm(c.fk_max_error_m)+' mm'],...(c.range_diagnostics||[]).map(x=>['联合指令 '+x.phase.split('_').at(-1),tag(x.free_tracking_passed,'跟踪通过','跟踪受限'),fmt(x.tracking_error_rad,4)+' rad'])])+'<p class="small">逐轴测试使用有限增量。联合闭合受限项保留原碰撞和关节约束，不据此宣称全行程或任意手势都已验证。</p>'}
return table(['检查','结果','实测'],[['加载组合',tag(audit.passed),audit.shape_channel_cases+' 个：球头 / 平头 / 圆柱头'],['卸载恢复',tag(audit.recovered_force_max_N<.01),fmt(audit.recovered_force_max_N,6)+' N'],['作用与反作用',tag(audit.action_reaction_error_N<.01),fmt(audit.action_reaction_error_N,8)+' N'],['图像与物理时钟',tag(Object.values(audit.camera_clock_error_s).every(v=>v===0)),'最大 '+fmt(Math.max(...Object.values(audit.camera_clock_error_s)),8)+' s'],['图像解码和数据读回',tag(audit.recorded_jpeg_decoding),'逐帧核对']]);}
async function load(){const version=++loadVersion;videos.forEach(v=>v.pause());$('play').textContent='同步播放';let model=models[+$('model').value];run=model.runs[$('kind').value];let next=await(await fetch(run.trace)).json();if(version!==loadVersion)return;rows=next;activeFrame=0;$('seek').max=rows.length-1;$('seek').value=0;$('videos').replaceChildren();videos=[];let isContact=$('kind').value==='contact';$('component').options[2].disabled=$('kind').value==='motion';if($('kind').value==='motion'&&$('component').value==='friction_force_world_N')$('component').value='normal_force_world_N';$('modality').disabled=isContact;if(isContact)$('modality').value='rgb';for(const [name,streams]of Object.entries(run.streams)){let src=streams[$('modality').value]||streams.rgb;let card=document.createElement('div');card.className='video-card'+(name==='tacmap'?' tacmap':'');let label=document.createElement('label');label.textContent=labels[name]||name;let v=document.createElement('video');v.src=src;v.preload='auto';v.muted=true;v.playsInline=true;v.controls=false;v.addEventListener('seeking',()=>{if(v===videos[0]&&Math.abs(v.currentTime-activeFrame/run.fps)>.25){for(const other of videos.slice(1))if(other.readyState>0)other.currentTime=v.currentTime;draw(Math.min(rows.length-1,Math.floor(v.currentTime*run.fps)))}});card.append(label,v);$('videos').append(card);videos.push(v)}
$('status').innerHTML='<b>'+model.title+' · '+kinds[$('kind').value]+'</b>　'+tag(run.audit.passed)+'<br><span class="small">录制 '+run.name+' · '+run.frames+' 帧 · 公开动作接口 '+tag(model.interface.passed)+' · 数据来源各自独立</span>';$('results').innerHTML=resultTable($('kind').value,run.audit);if($('kind').value==='grasp'){let trials=run.audit.checks.dynamic_trials;let stable=trials.filter(x=>x.release_offset_m<.03).length;$('status').innerHTML+='<br><span class="small">抬升·保持·释放 '+trials.filter(x=>x.passed).length+'/6；最终位置偏移低于 30 mm：'+stable+'/6。后者单列诊断，不包含在抓取通过判据中。</span>'}$('download').href=run.data;$('report').href=run.report;$('auditLink').href=run.audit_file;$('clockNote').textContent='回放按帧排列，标称 '+run.fps+' 帧/秒。真实仿真时间见当前帧；阶段边界可能不是等间隔采样。深度黑色表示无效距离。';$('forceNote').textContent=$('kind').value==='motion'?'运动测试未设置外部物体，显示测点总法向接触力；摩擦分量未采集。':'原生求解器对指定物体的法向力与摩擦力，单位 N。条形长度采用当帧相对比例，数值为实际记录；左右手以绿 / 蓝区分。';$('boundary').innerHTML='<p>Wuji 2.1：原厂无指尖传感器，输出末节虚拟聚合接触力。Wuji 2.2：输出实际传感器垫片上的聚合接触力；尚无逐触点实物标定。Sharpa：原生力（N）与官方 TacMap 几何深度（m）分开核对，热图不是光学 RGB 或 FEM。因时：双手共 12 路末节 / 掌部接触力，未伪造硬件 17 个触觉贴片或 1062 个触点。</p><p>自由物体为 25 g，球直径 50 mm、方块边长 44 mm、圆柱直径 46 mm / 高 48 mm。有重力和自碰撞，无物体粘连。每种形状是一次独立物理试验；支撑撤离后再抬升。抓姿、材料和控制参数保存在各录制的执行输入。</p><p>HDF5 保存关节 / 目标 / 接触力 / 时间。运动与抓取包含五路无损 RGB、米制深度；接触夹具保存录制 JPEG 原字节，Sharpa 另存十路几何深度和厂家编码。合成图像和参考外参不代表实物相机标定。</p><p>本项数据摘要：<code>'+run.hdf5_sha256+'</code></p>';
document.querySelectorAll('.model-card').forEach((c,i)=>c.classList.toggle('active',i===+$('model').value));history.replaceState(null,'','#'+model.model+'/'+$('kind').value);draw(0)}
function draw(k){const r=rows[k];if(!r)return;activeFrame=k;$('seek').value=k;$('phase').textContent='帧 '+k+' · t='+fmt(r.time_s,3)+' s · '+r.phase;let ctx=$('force').getContext('2d');ctx.clearRect(0,0,1300,230);let values=(r[$('component').value]||r.force_world_N).map(f=>Math.hypot(...f)),peak=Math.max(.001,...values),w=1260/values.length;values.forEach((v,i)=>{let h=142*v/peak;ctx.fillStyle=i<values.length/2?'#78d9c2':'#8ab9f6';ctx.fillRect(20+i*w,160-h,w*.66,h);ctx.fillStyle='#d6e4f0';ctx.font='12px system-ui';ctx.fillText(fmt(v),20+i*w,151-h);ctx.save();ctx.translate(20+i*w,181);ctx.rotate(-.16);ctx.fillText((i<values.length/2?'左':'右')+(/thumb/.test(run.channels[i])?'拇指':/index/.test(run.channels[i])?'食指':/middle/.test(run.channels[i])?'中指':/ring/.test(run.channels[i])?'无名指':/pinky|little/.test(run.channels[i])?'小指':'掌部'),0,0);ctx.restore()});$('details').textContent=JSON.stringify({frame:r.frame,time_s:r.time_s,camera_time_s:r.camera_sensor_time_s,joints:run.joint_names.map((n,i)=>({name:n,position:r.joint_position_rad[i],requested:r.requested_target_rad?.[i],unit:run.joint_units[i]})),object_states_si:r.object_states_si,fixture_depth_m:r.fixture_depth_m},null,2)}
$('play').onclick=async()=>{if(!videos.length)return;if(videos[0].paused){let time=videos[0].currentTime;try{await Promise.all(videos.map(v=>{v.currentTime=time;return v.play()}));$('play').textContent='同步暂停'}catch(e){$('status').textContent='视频播放失败：'+e.message}}else{videos.forEach(v=>v.pause());$('play').textContent='同步播放'}};$('seek').oninput=()=>{let k=+$('seek').value;videos.forEach(v=>{v.pause();v.currentTime=k/run.fps});$('play').textContent='同步播放';draw(k)};['model','kind','modality'].forEach(id=>$(id).onchange=()=>load().catch(showError));$('component').onchange=()=>draw(activeFrame);function showError(e){$('status').textContent='读取失败：'+e.message}setInterval(()=>{if(videos.length&&!videos[0].paused){const t=videos[0].currentTime;videos.slice(1).forEach(v=>{if(v.readyState>1&&Math.abs(v.currentTime-t)>.15)v.currentTime=t});draw(Math.min(rows.length-1,Math.floor(t*run.fps+1e-6)))}},100);
fetch('summary.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{models=d.models;models.forEach((m,i)=>{let option=document.createElement('option');option.value=i;option.textContent=m.title;$('model').append(option);let card=document.createElement('button');card.className='model-card';card.innerHTML='<strong>'+m.title+'</strong><span class="small">运动 '+tag(m.runs.motion.audit.passed)+' · 接触 '+tag(m.runs.contact.audit.passed)+'<br>抓取 '+tag(m.runs.grasp.audit.passed)+'</span>';card.onclick=()=>{$('model').value=i;load().catch(showError)};$('modelCards').append(card)});const [id,kind]=location.hash.slice(1).split('/');let index=models.findIndex(m=>m.model===id);if(index>=0)$('model').value=index;if(kinds[kind])$('kind').value=kind;return load()}).catch(showError);
</script></body></html>
