# G1-D (env config g1d, office): line the three blocks (block_<i>, three paints) up from left to right in the order
# of their colours named, block_0 leftmost: block_0 lies on the left, block_2 on the right.
# Layouts are generated by scripts/g1d/build_asset.py (PATTERN_TASKS) from scripts/objects/block_atomic.py; the sections
# below describe them. Blocks (Assets/Object/Blocks: wood_block_* painted 00001-00007, no two alike on one table) lie out
# to both sides, |x| 0.125 .. 0.18.
Rigid:
  -
    common:
      xlim: [-0.18, 0.18]
      ylim: [-0.53, -0.37]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"

    category:
      -
        name: wood_block_cube
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_short_cylinder
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_tile
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_half_cylinder
        index: [1, 2, 4, 5, 7]

    select_mode:
      nums: 3
      mode: "unique"
      label: ["block_0", "block_1", "block_2"]
