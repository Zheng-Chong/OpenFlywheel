# G1-D (env config g1d, office): open the named door, drawer or lid of the articulated object on the desk (target).
# Layouts are generated by scripts/g1d/build_asset.py (PATTERN_TASKS) from scripts/objects/open_anything.py: the object
# and its part come from its pool (scripts/objects/open_anything_pool.json, openable parts of the asset library's
# Articulation objects, pinned to one library release); the section below only sketches it with one pool object.
Articulation:
  -
    common:
      xlim: [-0.05, 0.05]
      ylim: [-0.20, -0.15]
      rotate_rand: True
      rotate_deg: 15
      relative_plane: "Table"
      check_mode: "none"

    category:
      -
        name: "microwave"
        index: [0]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["target"]
