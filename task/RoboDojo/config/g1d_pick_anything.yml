# G1-D (env config g1d, office): pick up the named object (target) from among 3-5 others (distractor_<j>) and hold it
# up. Layouts are generated by scripts/g1d/build_asset.py (PATTERN_TASKS) from scripts/objects/pick_anything.py: the
# target and the distractors come from its pool (scripts/objects/pick_anything_pool.json, 551 named objects the
# Dex1-1 jaw takes from the top); the sections below only sketch them with a few pool categories.
Rigid:
  -
    common:
      xlim: [-0.20, 0.20]
      ylim: [-0.48, -0.34]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"

    category:
      -
        name: soda_can
        index: [0]
      -
        name: sand3d_packaging
        index: [152]
      -
        name: wood_block_cube
        index: [1]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["target"]
  -
    common:
      xlim: [-0.28, 0.28]
      ylim: [-0.53, -0.30]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"

    category:
      -
        name: soda_can
        index: [1]
      -
        name: sand3d_packaging
        index: [208]
      -
        name: wood_block_cube
        index: [2]

    select_mode:
      nums: 3
      mode: "unique"
      label: ["distractor_0", "distractor_1", "distractor_2"]
