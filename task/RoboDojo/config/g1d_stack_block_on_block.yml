# G1-D (env config g1d, office): stack the named block (top_block) on the named base (base_block, a cube, short
# cylinder or cuboid), both on the same side; a third block (other_block) lies anywhere.
# Layouts are generated by scripts/g1d/build_asset.py (PATTERN_TASKS) from scripts/objects/block_atomic.py; the sections
# below describe them. Blocks (Assets/Object/Blocks: wood_block_* painted 00001-00007, no two alike on one table) lie out
# to both sides, |x| 0.125 .. 0.18.
Rigid:
  -
    common:
      xlim: [-0.18, 0.18]
      ylim: [-0.53, -0.37]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"

    category:
      -
        name: wood_block_cube
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_short_cylinder
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_cuboid
        index: [1, 2, 4, 5, 7]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["base_block"]
  -
    common:
      xlim: [-0.18, 0.18]
      ylim: [-0.53, -0.37]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"

    category:
      -
        name: wood_block_cube
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_short_cylinder
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_tile
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_half_cylinder
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_small_prism
        index: [1, 2, 4, 5, 7]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["top_block"]
  -
    common:
      xlim: [-0.18, 0.18]
      ylim: [-0.53, -0.37]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"

    category:
      -
        name: wood_block_cube
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_short_cylinder
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_half_cylinder
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_small_prism
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_tile
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_cuboid
        index: [1, 2, 4, 5, 7]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["other_block"]
