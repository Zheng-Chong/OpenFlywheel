# G1-D (env config g1d, office): put the block on the round red mark (block_mark). The mark lies in front of the robot,
# the block on the mark's side when the mark is off the midline.
# Layouts are generated by scripts/g1d/build_asset.py (PATTERN_TASKS) from scripts/objects/block_atomic.py; the sections
# below describe them. Blocks (Assets/Object/Blocks: wood_block_* painted 00001-00007, no two alike on one table) lie out
# to both sides, |x| 0.125 .. 0.18.
Rigid:
  -
    common:
      xlim: [-0.06, 0.06]
      ylim: [-0.47, -0.39]
      rotate_rand: False
      relative_plane: "Table"

    category:
      -
        name: block_mark
        index: [0]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["mark"]
  -
    common:
      xlim: [-0.18, 0.18]
      ylim: [-0.53, -0.37]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"

    category:
      -
        name: wood_block_cube
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_short_cylinder
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_half_cylinder
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_small_prism
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_tile
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_cuboid
        index: [1, 2, 4, 5, 7]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["block"]
