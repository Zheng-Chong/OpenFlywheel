# G1-D (env configs g1d, g1d_shenzhen_lab): pick up the named object (target) with the hand on its side, hand it over in
# the air to the other hand and put it on the named support (receptacle) on that hand's side, among 1-3 others
# (distractor_<j>). Layouts are generated by scripts/datagen/handover_anything_layouts.py from
# scripts/objects/handover_anything.py: the target from scripts/objects/handover_anything_pool.json (pick anything's
# commercial objects with a long side), the receptacle from scripts/objects/place_anything_receptacles_r2.json
# (supports); the sections below only sketch them.
Rigid:
  -
    common:
      xlim: [-0.24, -0.08]
      ylim: [-0.50, -0.32]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"

    category:
      -
        name: pen
        index: [4]
      -
        name: sand3d_tableware
        index: [64]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["target"]
  -
    common:
      xlim: [0.10, 0.22]
      ylim: [-0.50, -0.36]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"

    category:
      -
        name: sand3d_tableware
        index: [3]
      -
        name: sand3d_tableware
        index: [18]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["receptacle"]
  -
    common:
      xlim: [-0.28, 0.28]
      ylim: [-0.53, -0.30]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"

    category:
      -
        name: soda_can
        index: [1]
      -
        name: wood_block_cube
        index: [2]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["distractor_0"]
