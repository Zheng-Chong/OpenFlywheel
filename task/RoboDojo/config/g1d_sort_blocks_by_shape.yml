# G1-D (env config g1d, office): sort the painted wood blocks (Assets/Object/Blocks: wood_block_* 00001-00007) into
# the two wooden trays (Rigid/block_tray/00000) by the card lying behind each (block_sort_card, by shape). Eval
# layouts are generated by scripts/g1d/build_asset.py (PATTERN_TASKS) from scripts/objects/block_sorting.py: the trays
# side by side in the middle (box_0 left, box_1 right) with card_0 / card_1 behind them; four blocks (one of the two
# cards' shapes in any sorting paint, two per card) out to both sides, one of each card or none on the side away from
# its tray, labels shuffled. The sections below describe that layout; which blocks appear depends on the cards. The
# success check reads each tray's class from its card.
Rigid:
  -
    common:
      xlim: [-0.05, 0.05]
      ylim: [-0.43, -0.41]
      rotate_rand: False
      relative_plane: "Table"

    category:
      -
        name: block_tray
        index: [0]

    select_mode:
      nums: 2
      mode: "allow_duplicate"
      label: ["box_0", "box_1"]
  -
    common:
      xlim: [-0.05, 0.05]
      ylim: [-0.31, -0.29]
      rotate_rand: False
      relative_plane: "Table"

    category:
      -
        name: block_sort_card
        index: [5, 6, 7, 8, 9]

    select_mode:
      nums: 2
      mode: "unique"
      label: ["card_0", "card_1"]
  -
    common:
      xlim: [-0.18, 0.18]  # |x| >= 0.125, out beside the trays
      ylim: [-0.53, -0.37]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"

    category:
      -
        name: wood_block_cube
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_short_cylinder
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_half_cylinder
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_small_prism
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_tile
        index: [1, 2, 4, 5, 7]

    select_mode:
      nums: 4
      mode: "allow_duplicate"
      label: ["block_0", "block_1", "block_2", "block_3"]
