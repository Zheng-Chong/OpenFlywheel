# G1-D (env configs g1d, g1d_shenzhen_lab): put the named object (target) into the named container (receptacle: bowl, basket, box, cup ...)
# among 2-4 others (distractor_<j>). Layouts are generated by scripts/datagen/place_anything_layouts.py from
# scripts/objects/place_anything.py: the target from g1d_pick_anything's pool (scripts/objects/pick_anything_pool.json),
# the receptacle from scripts/objects/place_anything_receptacles.json; the sections below only sketch them.
Rigid:
  -
    common:
      xlim: [-0.25, 0.25]
      ylim: [-0.53, -0.30]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"

    category:
      -
        name: soda_can
        index: [0]
      -
        name: wood_block_cube
        index: [1]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["target"]
  -
    common:
      xlim: [-0.10, 0.10]
      ylim: [-0.47, -0.37]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"

    category:
      -
        name: bowl
        index: [7]
      -
        name: storage_box
        index: [2]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["receptacle"]
  -
    common:
      xlim: [-0.28, 0.28]
      ylim: [-0.53, -0.30]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"

    category:
      -
        name: soda_can
        index: [1]
      -
        name: wood_block_cube
        index: [2]

    select_mode:
      nums: 2
      mode: "unique"
      label: ["distractor_0", "distractor_1"]
