# G1-D (env config g1d, office): turn the long block (block: a plank, short plank or cuboid) lying askew parallel
# to the table edge, about where it lay.
# Layouts are generated by scripts/g1d/build_asset.py (PATTERN_TASKS) from scripts/objects/block_atomic.py; the sections
# below describe them. Blocks (Assets/Object/Blocks: wood_block_* painted 00001-00007, no two alike on one table) lie out
# to both sides, |x| 0.125 .. 0.18.
Rigid:
  -
    common:
      xlim: [-0.18, 0.18]
      ylim: [-0.53, -0.37]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"

    category:
      -
        name: wood_block_plank
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_short_plank
        index: [1, 2, 4, 5, 7]
      -
        name: wood_block_cuboid
        index: [1, 2, 4, 5, 7]

    select_mode:
      nums: 1
      mode: "unique"
      label: ["block"]
