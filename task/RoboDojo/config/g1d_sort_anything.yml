# G1-D (env configs g1d, g1d_shenzhen_lab): sort 2-4 objects (item_<i>) of 2-3 classes into one receptacle per class
# (receptacle_<j>: tray, plate, cutting board, basket, box, bowl), as the instruction says. Layouts are generated by
# scripts/datagen/sort_anything_layouts.py from scripts/objects/sort_anything.py: the objects from g1d_pick_anything's
# commercially usable pool (scripts/objects/pick_anything_pool.json), the receptacles from
# scripts/objects/place_anything_receptacles_r2.json, each layout with its instruction; the sections below only
# sketch them.
Rigid:
  -
    common:
      xlim: [-0.24, 0.24]
      ylim: [-0.45, -0.30]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"

    category:
      -
        name: block_tray
        index: [0]
      -
        name: sand3d_tableware
        index: [18]

    select_mode:
      nums: 2
      mode: "unique"
      label: ["receptacle_0", "receptacle_1"]
  -
    common:
      xlim: [-0.25, 0.25]
      ylim: [-0.53, -0.30]
      rotate_rand: True
      rotate_deg: 180
      relative_plane: "Table"

    category:
      -
        name: soda_can
        index: [0]
      -
        name: wood_block_cube
        index: [1]

    select_mode:
      nums: 2
      mode: "unique"
      label: ["item_0", "item_1"]
