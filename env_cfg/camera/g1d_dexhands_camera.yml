# Head mounts come from the robot descriptors; inherited reference, not unit calibration.
# No Dex1 wrist cameras on these hands.
annotator:
  common:
    enabled: true
    rgb_capture: {type: rgb, device: cpu}
  cam_head:
    enabled: true
    rgb_capture: {type: rgb, device: cpu}
  cam_head_right:
    enabled: true
    rgb_capture: {type: rgb, device: cpu}
cam_third:
  camera:
    type: Gemini_345Lg
    mesh: pinhole
    pos: [0.65, -0.32, 1.2]
    ori: [0.4666, 0.3108, 0.459, 0.6892]
