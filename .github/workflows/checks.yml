name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git submodule update --init --depth 1 XPolicyLab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.11.7 pytest numpy scipy h5py opencv-python-headless pyyaml shapely rtree transforms3d tqdm trimesh Pillow matplotlib pyarrow
      - run: bash scripts/check.sh
